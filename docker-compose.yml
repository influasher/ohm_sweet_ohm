version: '0.1'

volumes:
  postgres_data: {}
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
  db:
    image: postgres:16-alpine
    container_name: OSO_db
    ports:
      - 5432:5432
    environment:
      #put env variables here
    volumes:
      - postgres_data:/var/lib/postgresql/data